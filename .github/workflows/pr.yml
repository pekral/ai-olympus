name: Pull Request Quality Checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  # Every check runs on every PHP version, split into parallel groups so the slowest group, not the
  # sum of all checks, sets the wait. The shell self-tests run as two shards of one script list.
  quality-checks:
    name: "🔍 Quality Checks (PHP ${{ matrix.php }}, ${{ matrix.group }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
        group: ['static analysis', 'ShellCheck and coverage', 'shell self-tests 1/2', 'shell self-tests 2/2']
        include:
          - group: 'shell self-tests 1/2'
            shard: '1/2'
          - group: 'shell self-tests 2/2'
            shard: '2/2'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: pcov, dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: pcov

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ matrix.php }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php-${{ matrix.php }}-

      # Some development tools cap their PHP constraint at the newest released version; on the
      # unreleased PHP 8.6 only that upper bound is ignored.
      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction ${{ matrix.php == '8.6' && '--ignore-platform-req=php+' || '' }}

      - name: "🔒 Security Audit"
        if: matrix.group == 'static analysis'
        run: composer security-audit

      - name: "📝 Composer Normalize"
        if: matrix.group == 'static analysis'
        run: composer composer-normalize-check

      - name: "🔍 PHP CodeSniffer"
        if: matrix.group == 'static analysis'
        run: composer phpcs-check

      - name: "🎨 Laravel Pint"
        if: matrix.group == 'static analysis'
        run: composer pint-check

      - name: "🔄 Rector"
        if: matrix.group == 'static analysis'
        run: composer rector-check

      - name: "🔎 PHPStan Analysis"
        if: matrix.group == 'static analysis'
        run: composer analyse

      - name: "🐚 ShellCheck"
        if: matrix.group == 'ShellCheck and coverage'
        run: composer shellcheck

      - name: "🧪 Shell Self-Tests"
        if: matrix.group == 'shell self-tests 1/2' || matrix.group == 'shell self-tests 2/2'
        env:
          SHELL_SELF_TESTS_SHARD: ${{ matrix.shard }}
        run: composer shell-self-tests

      # The runtime agent guard tests need a usable bwrap. Ubuntu 24.04 restricts unprivileged user
      # namespaces through AppArmor, so the restriction is lifted on this throwaway runner only.
      - name: "🛡️ Install bubblewrap for the agent guard tests"
        if: matrix.group == 'ShellCheck and coverage'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap
          if sysctl -n kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          bwrap --dev-bind / / -- true

      - name: "📊 Coverage Tests"
        if: matrix.group == 'ShellCheck and coverage'
        env:
          AI_OLYMPUS_EXPECT_CONFINEMENT: '1'
        run: composer test:coverage

  # The required status checks name one quality check per PHP version. Each of them passes only
  # when every quality job above passed; a failed, cancelled, or skipped job fails all three.
  quality-checks-result:
    name: "🔍 Quality Checks (PHP ${{ matrix.php }})"
    needs: quality-checks
    if: always()
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']

    steps:
      - name: "✅ Every quality job passed"
        env:
          RESULT: ${{ needs.quality-checks.result }}
        run: |
          echo "The quality jobs finished with the result: $RESULT"
          test "$RESULT" = success

  php-compatibility:
    name: "PHP ${{ matrix.php }} syntax lint"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # The development tools need PHP 8.4, so the quality checks cannot run on these versions.
      # The lint still parses every file with the oldest PHP the package allows; the compatibility
      # job below installs the distribution and runs the CLI on the same versions.
      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: "🔎 Lint the PHP files"
        run: git ls-files -z -- '*.php' 'bin/*' | xargs -0 -n 1 php -d display_errors=stderr -l > /dev/null

  skill-check:
    name: "📋 Skill Check"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: "📋 Skill Check"
        run: composer skill-check

  installer-compatibility:
    name: "Installer (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5', '8.6']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@2.37.1
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Install the distribution in a clean consuming project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ai-olympus-dist" "$RUNNER_TEMP/ai-olympus-consumer"
          composer --no-plugins --no-scripts archive --format=zip --dir="$RUNNER_TEMP/ai-olympus-dist" --file=ai-olympus
          php <<'PHP'
          <?php
          $package = json_decode(file_get_contents('composer.json'), true, 512, JSON_THROW_ON_ERROR);
          $package['version'] = '0.1';
          $package['dist'] = ['type' => 'zip', 'url' => 'file://' . getenv('RUNNER_TEMP') . '/ai-olympus-dist/ai-olympus.zip'];
          $consumer = [
              'name' => 'ai-olympus/compatibility-test',
              'require' => ['pekral/ai-olympus' => '0.1'],
              'repositories' => [['type' => 'package', 'package' => $package], ['packagist.org' => false]],
              'config' => ['allow-plugins' => ['pekral/ai-olympus' => true]],
          ];
          file_put_contents(getenv('RUNNER_TEMP') . '/ai-olympus-consumer/composer.json', json_encode($consumer, JSON_THROW_ON_ERROR | JSON_PRETTY_PRINT));
          PHP
          cd "$RUNNER_TEMP/ai-olympus-consumer"
          composer install --no-dev --prefer-dist --no-interaction --no-progress
          composer check-platform-reqs --no-dev
          vendor/bin/ai-olympus install --force
          test -f .claude/skills/resolve-issue/SKILL.md
          test -f .codex/agents/krang.toml
          test -f .agents/skills/resolve-issue/SKILL.md
          test ! -e CLAUDE.md
          test -f vendor/pekral/ai-olympus/assets/agents/manifest.json
          test -f vendor/pekral/ai-olympus/assets/agents/activity.css
          for agent in krang donatello leonardo splinter raphael michelangelo april casey shredder; do
            test -f "vendor/pekral/ai-olympus/assets/agents/$agent.png"
            test -f "vendor/pekral/ai-olympus/assets/agents/thumbnails/$agent.png"
          done
          test ! -f vendor/pekral/ai-olympus/assets/social-preview.png
          test ! -f vendor/pekral/ai-olympus/assets/logo.png
          test ! -d vendor/pekral/ai-olympus/docs
          test ! -f "$HOME/.claude/settings.json"
          rm .claude/skills/resolve-issue/SKILL.md
          composer config --json extra.ai-olympus.auto-install true
          composer update --lock --no-dev --no-interaction --no-progress
          test -f .claude/skills/resolve-issue/SKILL.md
          test ! -f "$HOME/.claude/settings.json"
