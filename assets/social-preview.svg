<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <symbol id="icon-agents" viewBox="0 0 40 40">
      <circle cx="20" cy="10" r="3.4"/>
      <path d="M12 22 a8 8 0 0 1 16 0"/>
      <circle cx="11" cy="27" r="2.6"/>
      <path d="M5 36 a6 6 0 0 1 12 0"/>
      <circle cx="29" cy="27" r="2.6"/>
      <path d="M23 36 a6 6 0 0 1 12 0"/>
    </symbol>
    <symbol id="icon-gear" viewBox="0 0 40 40">
      <g transform="translate(20,20)">
        <circle r="9"/>
        <circle r="3"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(0)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(45)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(90)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(135)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(180)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(225)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(270)"/>
        <rect x="-2" y="-16" width="4" height="5" transform="rotate(315)"/>
      </g>
    </symbol>
    <symbol id="icon-box" viewBox="0 0 40 40">
      <path d="M20 4 L34 12 L34 26 L20 34 L6 26 L6 12 Z"/>
      <path d="M6 12 L20 19 L34 12"/>
      <path d="M20 19 L20 34"/>
    </symbol>
    <symbol id="icon-link" viewBox="0 0 24 24">
      <rect x="2" y="9" width="12" height="6" rx="3" transform="rotate(-45 8 12)"/>
      <rect x="10" y="9" width="12" height="6" rx="3" transform="rotate(-45 16 12)"/>
    </symbol>
  </defs>

  <!-- safe-margin guide content, kept within roughly 60px of every edge -->
  <rect width="1280" height="640" fill="#0a0a0a"/>

  <!-- brand row -->
  <rect x="60" y="54" width="34" height="34" rx="8" fill="none" stroke="#f2600c" stroke-width="2.5"/>
  <path d="M66 80 L74 66 L80 74 L88 60" fill="none" stroke="#f2600c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="80" font-family="Helvetica, Arial, sans-serif" font-size="26" font-weight="600" fill="#ffffff">pekral/ai-olympus</text>

  <!-- headline -->
  <text x="60" y="150" font-family="Helvetica, Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">An AI development team for Laravel</text>

  <!-- subtitle -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="23" font-weight="400" fill="#b4b4b4">
    <text x="60" y="192">Agentic AI framework for building and maintaining Laravel</text>
    <text x="60" y="222">web applications with Claude Code subagents, coding-standard</text>
    <text x="60" y="252">rules, and agent skills.</text>
  </g>

  <!-- card 1: agents -->
  <g>
    <rect x="60" y="298" width="690" height="78" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <use href="#icon-agents" x="92" y="317" width="40" height="40" fill="none" stroke="#f2600c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="164" y1="312" x2="164" y2="362" stroke="#2a2a2a" stroke-width="1"/>
    <text x="184" y="330" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Five specialized agents</text>
    <text x="184" y="350" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4b4b4">A ready-made team handles issue-to-PR workflows,</text>
    <text x="184" y="370" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4b4b4">code review, security audits, and Pest test coverage.</text>
  </g>

  <!-- card 2: rules, skills, orchestration -->
  <g>
    <rect x="60" y="388" width="690" height="78" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <use href="#icon-gear" x="92" y="407" width="40" height="40" fill="none" stroke="#f2600c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="164" y1="402" x2="164" y2="452" stroke="#2a2a2a" stroke-width="1"/>
    <text x="184" y="420" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Rules, skills, and orchestration</text>
    <text x="184" y="440" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4b4b4">Installs coding standards, 53 reusable skills, and</text>
    <text x="184" y="460" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4b4b4">focused agent roles for Claude Code workflows.</text>
  </g>

  <!-- card 3: install -->
  <g>
    <rect x="60" y="478" width="690" height="78" rx="8" fill="#141414" stroke="#2a2a2a" stroke-width="1"/>
    <use href="#icon-box" x="92" y="497" width="40" height="40" fill="none" stroke="#f2600c" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="164" y1="492" x2="164" y2="542" stroke="#2a2a2a" stroke-width="1"/>
    <text x="184" y="510" font-family="Helvetica, Arial, sans-serif" font-size="25" font-weight="700" fill="#ffffff">Composer or plugin install</text>
    <text x="184" y="530" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4b4b4">Use Composer for PHP projects or the Claude Code</text>
    <text x="184" y="550" font-family="Helvetica, Arial, sans-serif" font-size="19" font-weight="400" fill="#b4b4b4">plugin marketplace when Composer is not available.</text>
  </g>

  <!-- footer -->
  <use href="#icon-link" x="60" y="580" width="20" height="20" fill="none" stroke="#f2600c" stroke-width="1.8"/>
  <text x="90" y="596" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="500" fill="#4a9eff">github.com/pekral/ai-olympus</text>
</svg>
