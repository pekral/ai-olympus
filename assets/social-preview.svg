    An AI development team for Laravel
  </text>

  <text x="640" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#c7d2fe">
    Agents resolve issues, open PRs, review code &amp; ship tests
  </text>

  <!-- agent chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e0e7ff">
    <g>
      <rect x="260" y="360" width="150" height="52" rx="26" fill="#312e81"/>
      <text x="335" y="393" text-anchor="middle">daidalos</text>
    </g>
    <g>
      <rect x="425" y="360" width="130" height="52" rx="26" fill="#312e81"/>
      <text x="490" y="393" text-anchor="middle">talos</text>
    </g>
    <g>
      <rect x="570" y="360" width="130" height="52" rx="26" fill="#312e81"/>
      <text x="635" y="393" text-anchor="middle">argos</text>
    </g>
    <g>
      <rect x="715" y="360" width="140" height="52" rx="26" fill="#312e81"/>
      <text x="785" y="393" text-anchor="middle">athena</text>
    </g>
    <g>
      <rect x="870" y="360" width="150" height="52" rx="26" fill="#312e81"/>
