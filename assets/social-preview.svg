<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- safe-margin guide content, kept within ~80px of every edge -->
  <text x="640" y="220" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#f8fafc">
    An AI development team for Laravel
  </text>

  <text x="640" y="290" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#c7d2fe">
    Agents resolve issues, open PRs, review code &amp; ship tests
  </text>

  <!-- agent chips -->
  <g font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#e0e7ff">
    <g>
      <rect x="247" y="360" width="150" height="52" rx="26" fill="#312e81"/>
      <text x="322" y="393" text-anchor="middle">daedalus</text>
    </g>
    <g>
      <rect x="412" y="360" width="160" height="52" rx="26" fill="#312e81"/>
      <text x="492" y="393" text-anchor="middle">hephaestus</text>
    </g>
    <g>
      <rect x="587" y="360" width="140" height="52" rx="26" fill="#312e81"/>
      <text x="657" y="393" text-anchor="middle">athena</text>
    </g>
    <g>
      <rect x="742" y="360" width="135" height="52" rx="26" fill="#312e81"/>
      <text x="809" y="393" text-anchor="middle">argus</text>
    </g>
    <g>
      <rect x="893" y="360" width="140" height="52" rx="26" fill="#312e81"/>
      <text x="963" y="393" text-anchor="middle">hermes</text>
    </g>
  </g>

  <text x="640" y="480" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="400" fill="#a5b4fc">
    Claude Code
  </text>

  <text x="640" y="560" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#818cf8">
    pekral/ai-olympus
  </text>
</svg>
